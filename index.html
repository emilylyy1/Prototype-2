<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Prototype 2 - Large Pads</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Large Sound Pads</h1>

    <p>Click a pad to play a sound.</p>

    <div class="pads">

        <button class="pad" onclick="playSound(1)">
            Bass
        </button>

        <button class="pad" onclick="playSound(2)">
            Beat
        </button>

        <button class="pad" onclick="playSound(3)">
            Melody
        </button>

        <button class="pad" onclick="playSound(4)">
            Voice
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
